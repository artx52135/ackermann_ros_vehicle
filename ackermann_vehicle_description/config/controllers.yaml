controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    
    # Колёса
    left_wheel_names: ["rear_left_wheel_joint"]
    right_wheel_names: ["rear_right_wheel_joint"]
    
    wheel_separation: 0.4
    wheel_radius: 0.2
    
    # Odometry
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    
    # Команды
    cmd_vel_timeout: 0.5
    enable_odom_tf: true
    
    # Ограничения
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 3.0
    angular.z.min_velocity: -3.0